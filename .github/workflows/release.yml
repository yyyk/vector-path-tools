# Release: run by hand from the Actions tab ("Run workflow") on main.
#
# Before running it, bump the version in package.json and add a dated
# "## [x.y.z] - YYYY-MM-DD" entry to CHANGELOG.md, then merge that to main.
# The workflow then:
#
#   1. checks the CHANGELOG entry exists and is dated, and the tag vX.Y.Z
#      doesn't exist yet;
#   2. runs the tests and checks the package contents;
#   3. creates the tag and a GitHub release with the CHANGELOG entry as notes;
#   4. publishes the npm package, with provenance.
#
# Publishing is last because it can't be undone; if it fails, the release and
# tag can be deleted (or the publish retried) by hand.
#
# npm authentication uses trusted publishing (no token): on npmjs.com, in the
# package's settings, add this repository and the workflow file `release.yml`
# as a trusted publisher. The package has to exist first, so the very first
# version is published by hand.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to check the new one doesn't exist

      - name: Check CHANGELOG and tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a dated entry: ## [$version] - YYYY-MM-DD"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"; exit 1
          fi
          # Release notes: the CHANGELOG entry, without its heading and link lines.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Test and check the package
        run: |
          npm ci
          npm test
          npm publish --dry-run

      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}"
          --target "$GITHUB_SHA"
          --title "vector-path-tools ${{ steps.version.outputs.version }}"
          --notes-file release-notes.md

      - name: Publish to npm
        run: npm publish --provenance --access public
